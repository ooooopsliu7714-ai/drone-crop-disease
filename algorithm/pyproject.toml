# 项目元数据：只声明"算法侧服务 + 训练"这条链路需要的依赖。
# 完整安装建议与显存规划见 REQUIREMENTS.md（含 GPU 版 torch 的安装命令）。
#
# 用法：
#   pip install -e .                    # 只装核心（CPU 也能跑服务）
#   pip install -e ".[train,onnx,eval]" # 训练 + ONNX 部署 + 评估
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-crop-disease-algo"
version = "0.1.0"
description = "无人机农作物病害识别算法侧：RT-DETR + DINOv3 + SAM 2.1 三级流水线与 FastAPI 接口"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# 本地/服务器训练（注意：torch 建议按 REQUIREMENTS.md 用 cu128 源单独装）
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "timm>=1.0",
    "albumentations>=1.4",
    "scipy>=1.11",
]
# 生产推理
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
# 评估与报表
eval = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "psutil>=5.9",
    "requests>=2.31",
]
# 实验性：开放词汇检测与 YOLO 系对照（可选，包体较大）
openvocab = [
    "ultralytics>=8.3",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["src", "src.api", "src.infer", "src.runtime", "src.core", "src.data", "src.train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

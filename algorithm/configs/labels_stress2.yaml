# 标签体系：无人机植物病害检测数据集（2 类：healthy / stressed）
#
# 这套标签专门对接外部数据集 `无人机植物病害检测数据集`：
#   train 1083 图 / valid 304 图 / test 152 图，全部 640x640，共 20906 个框，
#   平均 13.6 框/图，目标中位尺寸约 131x131 px（不是小目标，无需切片）。
#
# 用哪套标签由环境变量 ALGO_LABELS_FILE 决定，**不需要改代码**：
#   $env:ALGO_LABELS_FILE = "configs/labels_stress2.yaml"
#   python -m scripts.train_det --data-root data/processed ...      # 2 类胁迫检测
#   $env:ALGO_LABELS_FILE = ""                                      # 回到 15 类病害体系
#
# ⚠️ 语义边界（答辩时务必如实说明，别夸大）：
#   stressed = 受胁迫植株，涵盖**病害感染 + 营养缺失 + 水分不足 + 环境压力**，
#   它**不是病种标签**。因此用这套标签只能做"胁迫/健康二分类"，
#   出不了"稻瘟病/条锈病"这种病种结论，也出不了国标病级。
#   本项目的 15 类病害体系（configs/labels.yaml）是二期目标。
#
# class_id 必须与数据集 data.yaml 的 names 顺序严格一致：['healthy', 'stressed']

version: 1

severity_levels:
  - key: healthy
    key_cn: 健康
    severity_index: 0
  - key: light
    key_cn: 轻度
    severity_index: 1
  - key: moderate
    key_cn: 中度
    severity_index: 2
  - key: severe
    key_cn: 重度
    severity_index: 3

classes:
  - class_id: 0
    disease_name: healthy          # 必须与 data.yaml 的 names[0] 一致
    disease_name_cn: 健康
    crop: generic
    is_disease: false
  - class_id: 1
    disease_name: stressed         # 必须与 data.yaml 的 names[1] 一致
    disease_name_cn: 受胁迫
    crop: generic
    is_disease: true

# ---------------------------------------------------------------------------
# 接口契约（与 configs/labels.yaml 完全一致，字段名不变；只是类别表不同）
# ---------------------------------------------------------------------------
# POST /algo/predict 响应顶层：code / message / image_id / disease_name /
#   disease_name_cn / confidence / severity / boxes / processing_time
# boxes[]：disease_name / disease_name_cn / confidence / severity / class_id /
#   x / y / w / h（归一化）+ x1 / y1 / x2 / y2（像素）
#
# 说明：ONNX 后处理以模型自带的 sidecar(model.onnx.json) 类别表为准，
# 所以 2 类模型不会把 class_id=1 错解释成 15 类体系里的"稻瘟病"。

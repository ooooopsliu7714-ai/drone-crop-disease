# 标签体系：全项目唯一真源（数据标注 / 训练 / 推理 / 前端联调都以此为准）
# disease_name 英文标识走接口字段，disease_name_cn 给农户端展示。
# class_id 是模型内部的整数索引（0 起），修改顺序会使已训练权重失效。

version: 1

# 严重度分级：接口字段 severity 只能取这四个值之一
severity_levels:
  - key: healthy
    key_cn: 健康
    severity_index: 0      # 用于病情指数计算的权重，健康=0
  - key: light
    key_cn: 轻度
    severity_index: 1      # 对应国标病级 1
  - key: moderate
    key_cn: 中度
    severity_index: 2      # 对应国标病级 2
  - key: severe
    key_cn: 重度
    severity_index: 3      # 对应国标病级 3 及以上

# 病害类别（检测/分类共用同一套 class_id）
classes:
  - class_id: 0
    disease_name: healthy            # 健康/无病
    disease_name_cn: 健康
    crop: generic
    is_disease: false
  - class_id: 1
    disease_name: rice_blast         # 稻瘟病
    disease_name_cn: 稻瘟病
    crop: rice
    is_disease: true
  - class_id: 2
    disease_name: rice_bacterial_blight  # 水稻白叶枯病
    disease_name_cn: 水稻白叶枯病
    crop: rice
    is_disease: true
  - class_id: 3
    disease_name: rice_sheath_blight     # 水稻纹枯病
    disease_name_cn: 水稻纹枯病
    crop: rice
    is_disease: true
  - class_id: 4
    disease_name: wheat_powdery_mildew   # 小麦白粉病
    disease_name_cn: 小麦白粉病
    crop: wheat
    is_disease: true
  - class_id: 5
    disease_name: wheat_stripe_rust      # 小麦条锈病
    disease_name_cn: 小麦条锈病
    crop: wheat
    is_disease: true
  - class_id: 6
    disease_name: wheat_fusarium_head_blight  # 小麦赤霉病
    disease_name_cn: 小麦赤霉病
    crop: wheat
    is_disease: true
  - class_id: 7
    disease_name: corn_northern_leaf_blight   # 玉米大斑病
    disease_name_cn: 玉米大斑病
    crop: corn
    is_disease: true
  - class_id: 8
    disease_name: corn_southern_leaf_blight   # 玉米小斑病
    disease_name_cn: 玉米小斑病
    crop: corn
    is_disease: true
  - class_id: 9
    disease_name: corn_rust              # 玉米锈病
    disease_name_cn: 玉米锈病
    crop: corn
    is_disease: true
  - class_id: 10
    disease_name: potato_late_blight     # 马铃薯晚疫病
    disease_name_cn: 马铃薯晚疫病
    crop: potato
    is_disease: true
  - class_id: 11
    disease_name: tomato_early_blight    # 番茄早疫病
    disease_name_cn: 番茄早疫病
    crop: tomato
    is_disease: true
  - class_id: 12
    disease_name: tomato_late_blight     # 番茄晚疫病
    disease_name_cn: 番茄晚疫病
    crop: tomato
    is_disease: true
  - class_id: 13
    disease_name: grape_black_rot        # 葡萄黑腐病
    disease_name_cn: 葡萄黑腐病
    crop: grape
    is_disease: true
  - class_id: 14
    disease_name: citrus_huanglongbing   # 柑橘黄龙病
    disease_name_cn: 柑橘黄龙病
    crop: citrus
    is_disease: true

# ---------------------------------------------------------------------------
# 与 Apifox 的接口契约（算法同学必须严格遵守，字段名一个字都不能改）
# ---------------------------------------------------------------------------
# 接口：POST /algo/predict
# 请求（二选一）：
#   A. {"image_id": "abc123"}                    # 服务端按 image_id 读取已上传图片
#   B. multipart/form-data: file=<图片>          # 直接上传图片文件
# 响应顶层字段（与语雀/Apifox 字段一致，禁止改名）：
#   code: int            200 成功
#   message: str         提示信息
#   image_id: str
#   disease_name: str    主病害英文标识（见上方 classes[].disease_name）
#   disease_name_cn: str 主病害中文名
#   confidence: float    主病害置信度 0~1，保留 4 位小数
#   severity: str        healthy | light | moderate | severe
#   boxes: list          识别框，元素字段见下
#   processing_time: float 秒
#
# boxes[] 元素字段：
#   disease_name, disease_name_cn, confidence, severity, class_id, x, y, w, h
#   说明：x/y/w/h 为归一化坐标（0~1，相对原图），便于小程序直接用百分比画框。
#   同时提供 x1,y1,x2,y2 像素坐标，方便后端画热力图。
#
# 兼容字段：部分前端同学会用 label / score / bbox，服务端同时冗余返回，
#   但主字段始终是 disease_name / confidence / boxes。
